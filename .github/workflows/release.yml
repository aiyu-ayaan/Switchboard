# Cuts a release: the signed Android APK and AAB, and the Windows installer.
#
# TRIGGERING
#
# A marker in the commit message on `master`, per development/Release-Commit.md:
#
#   !alpha   !beta     pre-release, bumps the pre-release counter
#   !stable            promotes the current pre-release to a final version
#   !patch  !fix       0.1.0 -> 0.1.1
#   !minor  !feat      0.1.0 -> 0.2.0
#   !major             0.1.0 -> 1.0.0
#
# A commit with no marker builds nothing. `workflow_dispatch` does the same
# thing with the marker picked from a menu, which is the way to re-cut a
# release without an empty commit.
#
# WHAT IT DOES NOT DO
#
# No portable desktop build, deliberately: the daemon keeps its host identity
# key in SQLite beside the install, and a portable copy that regenerates that
# key on every launch would silently un-pair every phone. See
# frontend/electron-builder.yml.
#
# No macOS desktop build: the system, audio and camera backends there still
# return ErrUnsupported, so the installer would ship an app whose controls all
# fail. It arrives with the backend.
#
# Linux ships an AppImage and a .deb. Both carry the same daemon the Windows
# installer does, built for linux/amd64, and drive displays, audio, media,
# telemetry and the pointer natively. What is still missing there -- clipboard
# push, power actions, the Stream Deck -- reports its capability as absent, so
# the phone hides those controls rather than offering ones that fail.
#
# The APKs are unsigned when ANDROID_KEYSTORE_BASE64 is absent, so a fork can
# run this without being handed a signing key.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      marker:
        description: 'Release kind'
        type: choice
        options: [alpha, beta, stable, patch, fix, minor, major]
        default: alpha

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: plan
        env:
          DISPATCH_MARKER: ${{ inputs.marker }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -eu

          # A dispatch says which kind directly; a push has to be read for a
          # marker. `!feat` is spelled both ways in Release-Commit.md.
          if [ -n "${DISPATCH_MARKER:-}" ]; then
            marker="$DISPATCH_MARKER"
          else
            marker=""
            for candidate in major minor feat patch fix stable beta alpha; do
              case "$COMMIT_MESSAGE" in
                *"!$candidate"*) marker="$candidate"; break ;;
              esac
            done
          fi
          [ "$marker" = feat ] && marker=minor
          [ "$marker" = fix ] && marker=patch

          if [ -z "$marker" ]; then
            echo "No release marker in the commit message; nothing to build."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current="$(node -p "require('./package.json').version")"
          echo "Current version: $current, marker: $marker"

          # 0.1.0 or 0.1.0-alpha.3 -> core and counter, handled separately.
          core="${current%%-*}"
          suffix=""
          case "$current" in *-*) suffix="${current#*-}" ;; esac
          major="${core%%.*}"
          rest="${core#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          case "$marker" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
            stable)
              # Drops the pre-release suffix. Already stable means a patch bump,
              # because a release that reuses a version is not a release.
              if [ -n "$suffix" ]; then next="$core"
              else next="${major}.${minor}.$((patch + 1))"; fi
              ;;
            alpha|beta)
              # Continue the counter when the channel matches, otherwise start
              # the new channel at 1 on the next patch.
              case "$suffix" in
                "$marker".*) next="${core}-${marker}.$(( ${suffix#*.} + 1 ))" ;;
                "") next="${major}.${minor}.$((patch + 1))-${marker}.1" ;;
                *)  next="${core}-${marker}.1" ;;
              esac
              ;;
          esac

          case "$next" in *-*) pre=true ;; *) pre=false ;; esac

          echo "Next version: $next (prerelease: $pre)"
          {
            echo "release=true"
            echo "version=$next"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One failing should not hide what the other did.
      fail-fast: false
      matrix:
        include:
          - label: APK
            artifact: apk
            task: ':app:assembleRelease'
          - label: AAB
            artifact: aab
            task: ':app:bundleRelease'
    defaults:
      run:
        working-directory: mobile
    # Hoisted, because a step-level `if` can read `env` but not `secrets`.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/decode-keystore.sh" "$RUNNER_TEMP/release.jks"

          # A keystore that will not open with the password and alias it was
          # given is worth finding out about now, rather than ten minutes later
          # as an APK that built fine and is not signed.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore decoded, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS does not open it."
            exit 1
          fi
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Warn when this build will be unsigned
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning title=Unsigned Android build::ANDROID_KEYSTORE_BASE64 is not set, so the APK and AAB cannot be installed as an upgrade or uploaded to Play."

      - name: Build ${{ matrix.label }}
        env:
          SWITCHBOARD_VERSION_NAME: ${{ needs.plan.outputs.version }}
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew ${{ matrix.task }} --stacktrace

      # `app-release.apk` says nothing about which release it is once it has
      # been downloaded.
      - name: Name the artifacts after the version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          KIND: ${{ matrix.artifact }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ "$KIND" = apk ]; then
            src=$(ls app/build/outputs/apk/release/*.apk | head -1)
            cp "$src" "$RUNNER_TEMP/out/Switchboard-${VERSION}.apk"
          else
            cp app/build/outputs/bundle/release/app-release.aab \
               "$RUNNER_TEMP/out/Switchboard-${VERSION}.aab"
          fi
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.artifact }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    # Each host builds its own daemon. The backends are per-GOOS files reaching
    # native APIs -- WASAPI and WMI on Windows, PulseAudio, D-Bus and XTEST on
    # Linux -- and Electron itself is packaged per platform, so neither half
    # cross-compiles from the other.
    strategy:
      # One platform failing should not hide what the other produced.
      fail-fast: false
      matrix:
        include:
          - label: Windows installer
            os: windows-latest
            artifact: desktop-windows
            script: 'package:win'
            cache: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
          - label: Linux packages
            os: ubuntu-latest
            artifact: desktop-linux
            script: 'package:linux'
            cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Backend and frontend only. `pnpm build` also builds the Android app,
      # which this job has no Java for and no use for -- the APKs come from the
      # `android` job. The daemon lands in bin/ and the renderer in
      # frontend/dist/, which is what electron-builder's `files` and
      # `extraResources` expect.
      - run: pnpm build:backend
      - run: pnpm build:frontend

      # The Electron zip is over 100 MB from GitHub's release CDN and is the
      # one step here that fails for reasons unrelated to this repository. The
      # Linux cache also covers appimagetool and fpm, which electron-builder
      # fetches from the same place on first use.
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Set the installer version
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # electron-builder takes the version from frontend/package.json. The
          # NSIS version field is numeric-only, so a pre-release suffix is
          # dropped here and lives on in the release title and the file name.
          # Debian would accept the suffix, but both platforms are kept on the
          # same number so a release is one version everywhere.
          core="${VERSION%%-*}"
          node -e "
            const fs = require('fs');
            for (const p of ['package.json', 'frontend/package.json']) {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = '$core';
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "

      # bash on both, rather than pwsh on one: the retry is the same on each
      # platform, and windows-latest runs bash perfectly well -- the version
      # step above has always relied on that.
      - name: Package
        shell: bash
        env:
          # No code-signing certificate on either platform. Without this
          # electron-builder goes looking for one in the machine store and
          # fails on what it finds.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # A cold cache drops often enough to sink a release on its own.
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter frontend ${{ matrix.script }}; then exit 0; fi
            echo "Package attempt $attempt failed; retrying."
            sleep 15
          done
          exit 1

      # electron-builder names its output from the version in package.json,
      # which had any pre-release suffix stripped above because NSIS will not
      # take one. The suffix belongs in the file name a user downloads, so it
      # is put back here. Windows produces one file and Linux two, so this
      # walks whatever was built rather than assuming a count.
      - name: Name the artifacts after the version
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/out"

          for src in frontend/release/*.exe; do
            cp "$src" "$RUNNER_TEMP/out/Switchboard-Setup-${VERSION}.exe"
          done
          for src in frontend/release/*.AppImage; do
            cp "$src" "$RUNNER_TEMP/out/Switchboard-${VERSION}.AppImage"
          done
          for src in frontend/release/*.deb; do
            cp "$src" "$RUNNER_TEMP/out/Switchboard-${VERSION}.deb"
          done

          # An empty directory here would otherwise surface as the upload's
          # error, which says nothing about which platform produced nothing.
          if [ -z "$(ls -A "$RUNNER_TEMP/out")" ]; then
            echo "::error::Packaging produced no artifacts. frontend/release held:"
            ls -la frontend/release || true
            exit 1
          fi
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, android, desktop]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the release notes below are built from the
      # commits since the previous tag, and the default shallow checkout has
      # neither the tag to measure from nor the commits to list.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{android-*,desktop-*}'
          merge-multiple: true

      - run: ls -la artifacts

      # Release notes from the commits themselves.
      #
      # `generate_release_notes` builds its list out of pull requests merged
      # since the last tag. Work here lands directly on master, so there were
      # none to find and every release shipped with an empty "What's Changed" --
      # the changes were real, the notes just could not see them.
      #
      # Collected before the version commit below, so that commit is not itself
      # part of the list.
      - name: Collect the release notes
        id: notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu

          # --match 'v*', because the only tags that bound a release are ours.
          # Absent on the very first release, where the range is all of history.
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            echo "Collecting commits since $previous"
          else
            echo "No previous tag; taking the whole history."
          fi

          {
            echo "## What's Changed"
            echo
            # Merges carry no change of their own, and the bot's version commits
            # are bookkeeping; everything else lands as its conventional-commit
            # summary with the release marker trimmed off the end.
            git log --no-merges --format='%s' ${previous:+"$previous..HEAD"} \
              | grep -v '^chore(release):' \
              | sed -e 's/ *![a-z]*$//' -e 's/^![a-z]* *: *//' -e 's/^/- /'
            echo
            if [ -n "$previous" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...v${VERSION}"
            fi
          } > "$RUNNER_TEMP/notes.md"

          cat "$RUNNER_TEMP/notes.md"
          echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      # The version in the manifests is what the next release bumps from, so it
      # has to land on master. Pre-release suffixes included: `plan` reads them
      # back to continue the counter.
      - name: Record the version on master
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            for (const p of ['package.json', 'frontend/package.json']) {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = process.env.VERSION;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json frontend/package.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push

      # Last, once every artifact exists. A tag that names a release whose
      # installer failed to build is worse than no tag.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: Switchboard v${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          # Not generate_release_notes: it would append its own (empty) pull
          # request list under a second "What's Changed" heading.
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/*
          fail_on_unmatched_files: true
