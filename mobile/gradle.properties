org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# R8 in full mode: more aggressive than the compatibility mode AGP defaults to,
# and the reason the release APK shrinks rather than merely being obfuscated.
android.enableR8.fullMode=true

# Each module gets only its own R fields instead of a copy of every dependency's.
android.nonTransitiveRClass=true
