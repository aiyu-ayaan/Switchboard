[package]
name = "switchboard-backend"
description = "Switchboard desktop daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "switchboard"
path = "src/main.rs"

[dependencies]
switchboard-core = { path = "../core" }
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.13"
mdns-sd = "0.13"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
dirs = "6"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
ddc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
ddc-i2c = { version = "0.2", features = ["with-linux"] }
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
ddc-winapi = "0.2"
enigo = "0.6"
wmi = "0.14"
mac_address = "1"
windows-core = "0.58"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Media",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
] }

[dev-dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
